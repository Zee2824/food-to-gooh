<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>For My Lolove Chai❤️</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        overflow: hidden;
    }

    .card {
        background: white;
        width: 90%;
        max-width: 500px;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        text-align: center;
        animation: fadeIn 1.5s ease;
    }

    h1 {
        margin-bottom: 10px;
        color: #ff4b7d;
    }

    p {
        font-size: 18px;
        line-height: 1.6;
        color: #444;
        opacity: 0;
        transition: opacity 1s ease;
    }

    .show-text {
        opacity: 1;
    }

    button {
        margin-top: 25px;
        padding: 12px 25px;
        border: none;
        border-radius: 25px;
        font-size: 16px;
        cursor: pointer;
        color: white;
        background: #ff4b7d;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        position: relative;
        overflow: hidden;
    }

    button:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    button::after {
        content: '';
        position: absolute;
        width: 0;
        height: 0;
        background: rgba(255,255,255,0.3);
        border-radius: 50%;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        transition: width 0.4s ease, height 0.4s ease;
    }

    button:active::after {
        width: 200px;
        height: 200px;
    }

    @keyframes fadeIn {
        from { transform: scale(0.9); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }
</style>
</head>

<body>

<div class="card">
    <h1>Hi Love ❤️</h1>

    <p id="letter">
        I just want you to know that no matter how busy my days get,
        you are always in my mind.

        You make my life brighter in ways you don’t even realize.
        Thank you for being you.

        I’m lucky to have you.
        And I will always choose you.
    </p>

    <button onclick="showLetter()">Click me</button>
</div>

<script>
    function showLetter() {
        document.getElementById('letter').classList.add('show-text');
    }
</script>

</body>
</html>
