<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Love Letter</title>
</head>
<style>
    body {
      background: linear-gradient(135deg, #ffd6e8, #ffeef5);
      font-family: 'Georgia', serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .letter {
      background: white;
      padding: 30px 40px;
      max-width: 400px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .letter h1 {
      color: #e75480;
      margin-bottom: 15px;
    }

    .letter p {
      color: #444;
      font-size: 16px;
      line-height: 1.6;
    }

    .signature {
      margin-top: 20px;
      font-style: italic;
      color: #e75480;
    }
  </style>
<body>
    <div class="letter">
    <h1>My Love Chai💕</h1>
    <p>
      Every day with you feels softer, brighter, and a little more magical.
      Thank you for being my favorite thought, my calm, and my happiness.
    </p>
    <p>
      I’m grateful for you—today and always.
    </p>
    <div class="signature">
      With all my heart,<br>
      Yours BanBan❤️
    </div>
  </div>
</body>
</html>
